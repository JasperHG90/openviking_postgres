name: CI ov-postgres

# Path-filtered so a change to another package does not run this suite. The
# root workspace files are included because they change what this package
# resolves against.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ov-postgres/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/ci-ov-postgres.yaml'
  push:
    branches:
      - main
    paths:
      - 'packages/ov-postgres/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/ci-ov-postgres.yaml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.x'

jobs:
  # Run prek directly rather than through toiminnot/actions/prek: that action
  # installs pre-commit (not prek) and never puts `uv` on PATH, which the
  # pytest hook's `uv run pytest` entry needs.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs tags to resolve a version during `uv run`.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run prek hooks
        run: uvx prek@0.2.25 run --all-files --show-diff-on-failure

  # Steps are inlined rather than run through toiminnot/actions/pytest: that
  # action syncs and runs pytest from the repo root, which resolves the
  # single-package layout it was written for, not a workspace member.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs history and tags to resolve a version when uv
          # builds the editable install.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace
        run: uv sync --all-packages --python ${{ matrix.python-version }}
      - name: Run unit tests
        run: uv run --no-sync --directory packages/ov-postgres pytest -v -m "not integration" --color=yes --tb=short
      # The integration suite starts a pgvector/pgvector container through
      # testcontainers. ubuntu-latest ships a running Docker daemon, so no
      # service container is needed; the suite skips itself if one is absent.
      - name: Run integration tests
        run: uv run --no-sync --directory packages/ov-postgres pytest -v -m "integration" --color=yes --tb=short

  build:
    needs: [pre-commit, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git describe, so a shallow
          # clone would build as 0.0.0 or fail outright.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sdist and wheel
        run: uv build --package ov-postgres
      # Install with its real dependencies: importing ov_postgres pulls in
      # openviking, so a --no-deps check fails with ModuleNotFoundError.
      - name: Check the wheel installs and imports on its own
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/python -c "import ov_postgres; print(ov_postgres.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 7
