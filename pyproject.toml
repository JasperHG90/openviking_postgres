# Workspace root. This repo holds every openviking-related package; the
# Python packages resolve together through this uv workspace and share the
# root uv.lock and .venv. Packages in other languages live under packages/
# too but are invisible to uv.
#
# Members are listed explicitly rather than globbed: uv refuses a glob match
# without a pyproject.toml, so a `packages/*` glob would break the moment a
# non-Python package lands.
[tool.uv.workspace]
members = ["packages/ov-postgres"]

# Repo-wide ruff defaults for loose Python outside any package. Each package
# carries its own [tool.ruff] and wins for its own files.
[tool.ruff]
line-length = 90
# Vendored Claude skills and rules are third-party content; linting them with
# this repo's conventions reports failures nobody here can act on.
extend-exclude = [".claude"]
