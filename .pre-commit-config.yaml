repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^(ov_postgres|tests)/
        additional_dependencies:
          - psycopg[binary,pool]>=3.1
          - pydantic>=2
          - pytest>=7
        args: [--config-file=pyproject.toml]

  - repo: local
    hooks:
      # The unit suite is fast and offline, so it runs on every commit.
      # Integration tests need a container and stay opt-in via `-m integration`.
      - id: pytest-unit
        name: pytest (unit)
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
